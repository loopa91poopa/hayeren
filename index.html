    // Тема применяется до отрисовки, чтобы не было вспышки светлого фона.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('hayeren-mopsi-het:v1') || '{}').settings || {};
        var t = s.theme || 'auto';
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
